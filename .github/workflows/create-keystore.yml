name: Create Fixed Keystore Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate fixed apexbid.jks
        run: |
          keytool -genkeypair -v \
            -keystore app/apexbid.jks \
            -alias apexbid \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ApexBid2026Key \
            -keypass ApexBid2026Key \
            -dname "CN=ApexBid, OU=Electrical, O=CityLightElectric, L=Hialeah, ST=FL, C=US"

      - name: Commit apexbid.jks to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/apexbid.jks
          git commit -m "Add fixed signing keystore apexbid.jks"
          git push
