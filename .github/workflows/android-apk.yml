name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Generate consistent signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/apexbid.jks \
            -alias apexbid \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ApexBid2026Key \
            -keypass ApexBid2026Key \
            -dname "CN=ApexBid, OU=Electrical, O=CityLightElectric, L=Hialeah, ST=FL, C=US" \
            -startdate "2026/01/01 00:00:00"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ApexBid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
